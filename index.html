*{box-sizing:border-box;margin:0}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6;display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100vh;padding:16px 16px 110px}
h1{font-size:24px;font-weight:800;line-height:1.3}h2{font-size:19px;font-weight:800}h3{font-size:16px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bk{background:var(--card);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;font-size:18px}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:20px;margin:14px 0;border-inline-start:6px solid var(--gold)}
.hero p{opacity:.8;font-size:14px}
.stats{display:flex;gap:10px;margin-bottom:18px}
.st{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.st b{display:block;font-size:22px;font-weight:800}
.sec{margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:right}
.ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{flex:none;padding:7px 16px;border-radius:30px;border:1px solid var(--line);background:var(--card);font-weight:600}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--navy);color:#fff}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;text-align:right}
.row .n{flex:1;min-width:0}.row small{display:block;color:var(--mut);font-size:13px}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--gold);color:var(--gold-ink);flex:none}
.tag.l{background:var(--line);color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 10px;border:2px dashed var(--line);border-radius:16px}
video{width:100%;border-radius:16px;background:#000;border:2px solid var(--gold)}
.btn{display:block;width:100%;background:var(--navy);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:700;margin-top:12px;text-align:center;text-decoration:none}
.btn.g{background:var(--gold);color:var(--gold-ink)}
.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.tm{background:var(--navy);color:#fff;border-radius:20px;padding:4px 12px;font-weight:700}
.pg{height:6px;background:var(--line);border-radius:6px;margin:0 0 18px;overflow:hidden}.pg i{display:block;height:100%;background:var(--gold)}
.score{font-size:60px;font-weight:800;text-align:center;color:var(--gold);margin:16px 0 0}
.plan{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.plan.best{border-color:var(--gold)}.plan b{font-size:26px}
.toast{background:var(--ok);color:#fff;border-radius:12px;padding:10px;text-align:center;margin-top:12px;font-weight:700}
.toast.e{background:var(--bad)}
.form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=url],select,textarea{width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.del{border:0;background:none;color:var(--bad);font-weight:700;padding:6px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:440px}
nav button{flex:1;border:0;background:none;padding:10px 0;color:var(--mut);font-size:12px;font-weight:600}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--ink)}
nav button.on::after{content:"";display:block;width:22px;height:3px;background:var(--gold);border-radius:3px;margin:2px auto 0}
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 38%,#16295A 0%,#0A1430 55%,#050A1A 100%);color:#fff;transition:opacity .7s ease,transform .7s ease;overflow:hidden}
#splash::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 38px,rgba(201,162,75,.07) 38px 39px)}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-sym{position:absolute;font-family:'Cormorant Garamond',Georgia,serif;color:rgba(201,162,75,.2);animation:spf 6s ease-in-out infinite alternate}
@keyframes spf{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.sp-cap{width:92px;height:92px;margin-bottom:18px;opacity:0;animation:spIn 1s .2s forwards;position:relative}
.sp-cap path{fill:none;stroke:#C9A24B;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:260;stroke-dashoffset:260;animation:spd 1.8s .3s ease forwards}
@keyframes spd{to{stroke-dashoffset:0}}
@keyframes spIn{to{opacity:1}}
.sp-name{position:relative;font-family:'Cinzel','Times New Roman',serif;font-weight:700;font-size:clamp(22px,7vw,40px);letter-spacing:.2em;padding-inline-start:.2em;background:linear-gradient(110deg,#8A6D2B,#F3D98B,#C9A24B,#FFF0B8,#8A6D2B);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;opacity:0;animation:spIn 1s .9s forwards,spSh 3s 1s linear infinite}
@keyframes spSh{to{background-position:-250% 0}}
.sp-line{position:relative;height:1px;width:0;background:linear-gradient(90deg,transparent,#C9A24B,transparent);margin:16px 0 12px;animation:spLn 1.2s 1.6s forwards}
@keyframes spLn{to{width:min(260px,64vw)}}
.sp-tag{position:relative;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:19px;color:#D9C28A;letter-spacing:.06em;opacity:0;animation:spIn 1s 2s forwards}
.sp-ar{position:relative;font-family:'Cairo',sans-serif;font-weight:600;font-size:20px;color:#F3D98B;margin-top:10px;opacity:0;animation:spIn 1s 2.4s forwards}
.sp-bar{position:absolute;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:min(180px,50vw);height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8A6D2B,#F3D98B);animation:spBar 4s linear forwards}
@keyframes spBar{to{width:100%}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}.sp-bar i{animation-duration:4s!important}}
.acc{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--gold);border-radius:16px;padding:12px 14px;box-shadow:0 6px 20px rgba(201,162,75,.18);text-align:right}
.acc-av{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.acc-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet2{width:100%;max-width:440px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-y;overflow-x:hidden;max-width:100%}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden;max-width:100%;position:relative}
#app{overflow-x:hidden}
input,select,textarea,button{max-width:100%}
input[type=file]{width:100%;min-width:0}
.row .n,.row h3,.row small,.form h3,.form p{overflow-wrap:anywhere;word-break:break-word}
.chips{touch-action:pan-x pan-y;overscroll-behavior-x:contain}

<script>
/* Standalone shim: replaces the Claude platform (db/assets/user) with phone storage (IndexedDB) */
(function(){
var DBN='mtf_local',dbp=null,L={};
function open(){return dbp||(dbp=new Promise(function(res,rej){var r=indexedDB.open(DBN,1);r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('docs',{keyPath:'path'});d.createObjectStore('blobs',{keyPath:'id'})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}))}
function tx(store,mode,fn){return open().then(function(d){return new Promise(function(res,rej){var t=d.transaction(store,mode),s=t.objectStore(store),r=fn(s);t.oncomplete=function(){res(r&&r.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function all(col){return tx('docs','readonly',function(s){return s.getAll()}).then(function(rows){return (rows||[]).filter(function(x){return x.col===col})})}
function notify(col){return all(col).then(function(rows){(L[col]||[]).forEach(function(cb){cb({docs:rows.map(function(r){return {id:r.id,data:function(){return r.data}}})})})})}
function put(col,id,data){return tx('docs','readwrite',function(s){return s.put({path:col+'/'+id,col:col,id:id,data:data})}).then(function(){return notify(col)})}
var db={
 collection:function(col){return {
  onSnapshot:function(cb){(L[col]=L[col]||[]).push(cb);all(col).then(function(rows){cb({docs:rows.map(function(r){return {id:r.id,data:function(){return r.data}}})})});return function(){}},
  add:function(obj){var id=uid();return put(col,id,obj).then(function(){return {id:id}})}
 }},
 doc:function(path){var p=path.split('/'),col=p[0],id=p[1];return {
  get:function(){return tx('docs','readonly',function(s){return s.get(path)}).then(function(r){return {exists:!!r,id:id,data:function(){return r&&r.data}}})},
  set:function(o){return put(col,id,o)},
  update:function(o){return tx('docs','readonly',function(s){return s.get(path)}).then(function(r){var d=Object.assign({},r&&r.data,o);return put(col,id,d)})},
  delete:function(){return tx('docs','readwrite',function(s){return s.delete(path)}).then(function(){return notify(col)})}
 }}
};
var assets={
 upload:function(blob,o){var id=uid();return tx('blobs','readwrite',function(s){return s.put({id:id,blob:blob,type:(o&&o.type)||blob.type||''})}).then(function(){return {id:id,url:'local:'+id}})},
 delete:function(id){return tx('blobs','readwrite',function(s){return s.delete(id)})}
};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
window.getBlob=function(id){return tx('blobs','readonly',function(s){return s.get(id)}).then(function(r){if(!r)throw new Error('missing');return r.blob})};
window.hydrateMedia=function(){document.querySelectorAll('video[data-a]').forEach(function(v){if(v.getAttribute('src'))return;window.getBlob(v.getAttribute('data-a')).then(function(b){v.src=URL.createObjectURL(b)}).catch(function(){})})};
window.claude={use:function(n){return Promise.resolve(n==='user'?{canEdit:function(){return true}}:n==='db'?db:n==='assets'?assets:null)}};
window.__back=function(){try{var v=S.v;if(v==='home')return false;if(v==='vid'||v==='file'){go('lib');return true}if(v==='run'||v==='res'){go('exam');return true}if(v==='onb'&&S.stu&&S.stu.role){go('home');return true}if(v==='pay'){go('home');return true}go('home');return true}catch(e){return false}};
})();
</script>
<script>
const SUB=[{id:'isl',n:'التربية الإسلامية',i:'🕌',c:'#2E8B57'},{id:'phy',n:'الفيزياء',i:'⚡',c:'#3B6FE0'},{id:'che',n:'الكيمياء',i:'🧪',c:'#14A38B'},{id:'bio',n:'الأحياء',i:'🧬',c:'#7B5BD6'},{id:'mat',n:'الرياضيات',i:'📐',c:'#E0833B'},{id:'ara',n:'اللغة العربية',i:'📖',c:'#B8527A'},{id:'eng',n:'اللغة الإنجليزية',i:'🔤',c:'#4A8FB8'}];
const TY={vid:{n:'فيديوهات',i:'▶️'},doc:{n:'ملازم',i:'📄'},book:{n:'كتب',i:'📘'},exf:{n:'امتحان فصلي',i:'📝'},exh:{n:'امتحان نصف سنة',i:'📝'},exw:{n:'امتحان وزاري',i:'📝'}};
const LIBT=['vid','doc','book'];
const QL=()=>QS.filter(q=>q.sub===S.sub&&(!S.tc||q.teacher===S.tc)&&(!S.un||q.unit===S.un)&&(!S.cat||q.cat===S.cat));
const S={v:'home',sub:'phy',type:'vid',item:null,qi:0,sc:0,pk:null,t:600,paid:false,msg:'',err:false,busy:false};
let ITEMS=[],QS=[],db=null,asset=null,realAdmin=false,admin=false,tm=null,ready=false;
const $=document.getElementById('app'),NAV=document.getElementById('nav');
setTimeout(()=>{const s=document.getElementById('splash');if(s){s.classList.add('out');setTimeout(()=>s.remove(),750)}},4000);
const fmt=t=>String(Math.floor(Math.max(t,0)/60)).padStart(2,'0')+':'+String(Math.max(t,0)%60).padStart(2,'0');
const sb=id=>SUB.find(x=>x.id===id)||{n:'',c:'#3B6FE0',i:'📚'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const canOpen=it=>true;
const tch=it=>it.teacher?' · أ. '+esc(it.teacher):'';
const src=it=>it.link||'';
function go(v,o){clearInterval(tm);Object.assign(S,o||{},{v,msg:'',err:false});if((v==='vid'||v==='file')&&S.item)mark(S.item);
 if(v==='run'&&QL().length){tm=setInterval(()=>{S.t--;const e=document.getElementById('tm');if(e)e.textContent=fmt(S.t);if(S.t<=0)go('res')},1000)}
 render();scrollTo(0,0)}
const hdr=(t,b)=>`<div class="hd"><button class="bk" aria-label="رجوع" onclick="go('${b}')">→</button><h2>${t}</h2></div>`;
const chips=()=>`<div class="chips">${SUB.map((x,i)=>`<button class="chip ${x.id===S.sub?'on':''}" onclick="pickS(${i})">${x.n}</button>`).join('')}</div><div class="chips"><button class="chip ${!S.tc?'on':''}" onclick="pickT(-1)">كل المدرسين</button>${T().map((n,i)=>`<button class="chip ${n===S.tc?'on':''}" onclick="pickT(${i})">${esc(n)}</button>`).join('')}</div><div class="chips"><button class="chip ${!S.un?'on':''}" onclick="pickU(-1)">كل الأقسام</button>${U().map((n,i)=>`<button class="chip ${n===S.un?'on':''}" onclick="pickU(${i})">${esc(n)}</button>`).join('')}</div>`;
const list=(t,s)=>ITEMS.filter(i=>i.type===t&&i.sub===S.sub&&(!S.tc||i.teacher===S.tc)&&(!S.un||i.unit===S.un)).sort(byOrd);
const empty=t=>`<div class="empty">${t}${admin?'<br>أضفه من تبويب «إدارة».':''}</div>`;
function render(){
 if(!S.stu||!S.stu.role||S.v==='onb'){NAV.innerHTML='';$.innerHTML=onbHtml();return}
 const tabs=['home','subs','lib','exam','me','adm'];
 NAV.innerHTML=tabs.includes(S.v)?`<div>${[['home','🏠','الرئيسية'],['subs','🗂️','المواد'],['lib','📚','المكتبة'],['exam','📝','الامتحانات'],admin?['adm','⚙️','إدارة']:['me','👤','حسابي']].map(t=>`<button class="${S.v===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div>`:'';
 let h='';
 if(!db&&ready){$.innerHTML=`<h1>مُتفوّق</h1><div class="empty" style="margin-top:20px">لازم تفتح الرابط وأنت مسجّل دخول بحساب Claude حتى يظهر المحتوى.</div>`;return}
 if(S.v==='home'){const nv=ITEMS.filter(i=>i.type==='vid').length,nd=ITEMS.filter(i=>i.type==='doc'||i.type==='book'||i.type==='exm').length;
 h=`${admin?'<span class="tag">نسخة المبرمج</span>':''}<p class="mut">أهلاً ${esc(S.stu.name.trim().split(' ')[0])} 👋</p><h1>جاهز لامتحان ${S.stu.grade==='6'?'السادس':'الثالث المتوسط'}؟</h1><div class="hero"><h2>مكتبتك الدراسية</h2><p>فيديوهات وملازم وكتب وامتحانات بمكان واحد.</p></div>

async function addTeacher(){const sub=v('t-sb'),name=v('t-nm').trim().replace(/\s+/g,' ');if(!name)return say('t-ms','اكتب اسم المدرس',1);if(TL(sub).some(n=>n===name))return say('t-ms','هذا المدرس موجود بالمادة',1);try{await db.collection('teachers').add({sub,name,ts:Date.now()});say('t-ms','تمت إضافة «'+name+'» ✓');document.getElementById('t-nm').value=''}catch(e){say('t-ms','ما انضاف المدرس',1)}}

let PT=0;
async function openPdfOld(){const it=ITEMS.find(x=>x.id===S.item),el=document.getElementById('pdfv');if(!it||!it.assetId||!el)return;
 const fail=()=>{const e=document.getElementById('pdfv');if(e)e.innerHTML='<div class="empty">ما قدرت أعرض الملف داخل الصفحة. استخدم زر التنزيل.</div>'};
 try{const bl=await getBlob(it.assetId),ty=bl.type||'';if(ty.indexOf('image/')===0){const u=URL.createObjectURL(bl);box.innerHTML='<img src="'+u+'" alt="" style="width:100%;border-radius:12px;background:#fff">';return}if(ty.indexOf('video/')===0){const u=URL.createObjectURL(bl);box.innerHTML='<video controls playsinline src="'+u+'" style="width:100%;border-radius:12px"></video>';return}}catch(e){}
 if(!window.pdfjsLib)return fail();const tk=++PT;
 try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const r=await fetch('/_blob/'+it.assetId);if(!r.ok)throw 0;
  const pdf=await pdfjsLib.getDocument({data:await r.arrayBuffer()}).promise;
  const box=document.getElementById('pdfv');if(tk!==PT||!box)return;
  const w=box.clientWidth||340,p1=await pdf.getPage(1),v1=p1.getViewport({scale:1}),ratio=v1.height/v1.width;
  box.innerHTML='<p class="mut" style="margin-bottom:8px">'+pdf.numPages+' صفحة</p>';
  const io=new IntersectionObserver(es=>es.forEach(async e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const c=e.target;try{const pg=await pdf.getPage(+c.dataset.p),b=pg.getViewport({scale:1}),dpr=Math.min(window.devicePixelRatio||1,2),vp=pg.getViewport({scale:w/b.width*dpr});c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}catch(x){}}),{rootMargin:'700px'});
  for(let i=1;i<=pdf.numPages;i++){const c=document.createElement('canvas');c.dataset.p=i;c.width=Math.round(w);c.height=Math.round(w*ratio);c.style.cssText='width:100%;height:auto;background:#fff;border-radius:8px;margin-bottom:8px;display:block';box.appendChild(c);io.observe(c)}
 }catch(e){fail()}}
